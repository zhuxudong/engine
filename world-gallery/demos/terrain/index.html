<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Terrain</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #202028;
      }
      #canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #status {
        position: fixed;
        top: 10px;
        left: 12px;
        color: #ddd;
        font: 12px/1.4 monospace;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #backend-control {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 20;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 8px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 6px;
        color: #ddd;
        background: rgb(20 20 28 / 82%);
        font: 12px/1.4 monospace;
      }
      #backend {
        color: #fff;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 4px;
        background: #282832;
        font: inherit;
      }
    </style>
  </head>
  <body data-terrain-inspector="true">
    <canvas id="canvas"></canvas>
    <div id="status">loading…</div>
    <label id="backend-control">
      backend
      <select id="backend" aria-label="Rendering backend">
        <option value="webgl2">webgl2</option>
        <option value="webgpu">webgpu</option>
      </select>
    </label>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
